# d435i-person 参数文件
#
# 优先级：命令行 > 本文件 > 代码里的兜底默认值。
# 未知键名会被警告（不会静默忽略），类型不对也会警告并忽略该项。
# 命令行想临时覆盖就见 `uv run d435i-person --help`。

[camera]
# 本机 D435i；用 `uv run d435i-person --list` 看所有可选设备。
# 留空 = 用 index 指定的那一台（多相机时必须用 serial 指认，否则谁先枚举到就用谁）。
serial = ""
index = 0

# 分辨率/帧率。两路都开，深度会被对齐到彩色视角（对齐后深度分辨率 = 彩色分辨率）。
# 可选值见 `rs-enumerate-devices -c`：D435i 深度 640x480/848x480 都支持
# @90/60/30/15/6，彩色 640x480/848x480 支持 @60，1280x720 只有 @30/15/6。
#
# 60 fps 只是**取流**上限，与推理帧率无关：推理跟不上时多余帧直接丢掉（日志里的
# "X 帧跳推理"），所以相机跑 60 而 detect_hz 只有 15 是完全正常的组合，好处是抖动
# 更小、时间戳更密。本机实测 640x480x60 双流带宽约 92 MB/s，USB3.2 富裕。
color_size = "640x480"
depth_size = "640x480"
fps = 60

# 曝光/增益：
#   "sdk"    = 用相机自己的自动曝光 + 自动增益（默认，推荐）
#   "manual" = 固定用下面的 exposure_us / gain
exposure_mode = "sdk"

# manual 模式的曝光（us）/ 增益：0 = 用设备当前值。
# 注意 D435i 的 Gain 不是 dB，是 sensor 的内部单位（典型范围 16-248）。
exposure_us = 0.0
gain = 0.0

# sdk 模式写彩色 sensor 的 Brightness（AE 的目标亮度，典型 0-255）；-1 = 不动它。
# 默认不动：D435i 的 AE 出厂表现已经够稳，写错反而会压暗画面（hik 那台相机是
# 必须先放开曝光上限再压增益，D435i 没这个问题）。
brightness = -1.0

# 红外发射器（1 开 / 0 关）与激光功率（典型 0-360）。
# 关发射器 = 没有 IR 结构光，深度在无纹理面上会大面积空洞，只在多相机互相干扰时才关。
# -1 一律表示"不动这项"（用设备当前值）。
laser_power = -1.0
emitter_enabled = -1

# 深度的视觉预设：-1 = 不动；D435i 常见 1=Default 2=High Accuracy 3=High Density
# 4=Medium Density（具体编号用 `rs-enumerate-devices -c` 或 viewer 里的下拉框确认）。
depth_preset = -1

# 取一帧的等待上限（毫秒）。低于相机帧间隔会开始丢帧；
# 60 fps 下帧间隔只有 17 ms，所以别把超时设得跟 30 fps 那么宽，
# 否则真卡住了要等很久才能恢得过来。
read_timeout_ms = 1000

[filters]
# 深度的后处理滤镜。默认全关：D435i 原生深度对关键点已经够用，滤镜会模糊边缘、
# 让关节处的深度变"糊"，开之前先在 rerun 里对比 [pose3d] 的效果。
# 另外 decimation 会改变深度分辨率（内参和 3D 全得跟着重算），本包不启用，
# 点云用 [points].stride 抽稀代替。
spatial = false
temporal = false
hole_filling = false

[detector]
# 本包只做 pose（骨架）；相对路径按项目根解析。
#
# 当前用 x（126 MB）：精度最好，但很贵。RTX 4060 Laptop 实测（含跟踪/点云/可视化
# 的**全链路**）：imgsz 640 -> 约 70 ms/帧（~14 Hz），imgsz 512 -> 约 45 ms（~22 Hz）。
# 本地三个权重：
#   n   7.9 MB  全链路 ~9.6 ms  -> 60 fps 宽松
#   m  49.0 MB  全链路 ~14.9 ms -> **能跑满 60 fps**（预算 16.7 ms）
#   x 126.2 MB  全链路 ~70 ms   -> 只能 ~14 Hz，60 fps 做不到
# 所以：想要 60 Hz 就把这行换成 m（或 n），并把 detect_hz 拉到 60；
# 想要更准就保持 x，或把 imgsz 提到 768（代价约 1.4x）。
# 下其他尺寸：cd models && uv run python -c "from ultralytics import YOLO; YOLO('yolo26l-pose.pt')"
weights = "models/yolo26x-pose.pt"
conf = 0.35
imgsz = 640
# "" = 有 CUDA 用 cuda:0，否则 cpu。
device = ""
# 关键点置信度低于它就当没看见（2D 骨架、3D 骨架、有效关键点计数都受影响）。
kpt_conf = 0.5

[run]
# 推理频率。**这是按模型实测能力设的，不是按相机 fps**：x 模型全链路约 70 ms/帧，
# 所以设 15（实际会跑到 ~14 Hz）。相机仍然以 60 fps 取流，中间帧丢掉不推理。
# 换 m/n 模型时把它拉到 60。
detect_hz = 15.0
# 限速容忍：帧到达时刻正好压在周期边界上时靠它避免白丢一半的帧（实测 15/15、30/15 都会）。
rate_tolerance = 0.9
# 跑够 duration 秒或 max_frames 帧后退出；0 = 不限。
duration = 0.0
max_frames = 0
# 检测到人时存标注图（模型画的框/骨架）。
save_dir = ""
save_min_interval = 1.0

[output]
# 非空则把每帧的人写成 JSON Lines（追加），每行：
#   {"t":..., "frame":..., "count":..., "people":[{"id","conf","distance","cam","world","box",...}]}
# 相对路径按项目根解析。下游接 ROS/机器人/日志分析都从这里取。
jsonl = ""
hz = 5.0

[rerun]
enabled = true
# 默认纯显示：不写任何文件。非空才写 .rrd 且不弹窗口（调试/无桌面时才用）。
save = ""

# false（默认）= 图像/点云/骨架用 static 记录：viewer 只保留最新一份，没有时间轴可回拖，
# 内存不随帧数涨。true = 带时间戳、可回拖，但内存一直涨。
keep_history = false

# 兼底硬上限（到顶丢最旧数据）；rerun 自己的默认是 75%（本机约 23 GB）。
memory_limit = "512MB"
server_memory_limit = "512MB"
# 图像送进 viewer 前先压成 JPEG（质量 1-100，0 = 不压原图）。
# 640×480 原图每帧 0.92 MB，压成 JPEG(75) 后约 0.05 MB。
jpeg_quality = 75
# viewer 的端口；被占用时 rerun 会直接拿来用。
port = 9876

# 右上角面板。
#   show_metrics = 人体指标曲线（速度/身高/肩宽/髀宽/腿长/步频/步幅…）
#   show_values  = 每人一行极简数值（`#1 · 距 2.31 m · 速 1.21 m/s · 行走 · 高 1.72 m`）
#   show_coords  = X/Y/Z 坐标曲线（默认关，曲线多了不好看）
#   show_count   = 人数曲线（数据一直在 person/count，只是默认不占面板）
show_metrics = true
show_values = true
show_coords = false
show_count = false

[metrics]
# 人体指标：速度、步态（步频/步幅）、尺寸（身高/肩宽/髀宽/腿长/臂展）。
# 真深度量的是真实长度（1-3 m 内深度误差 ~1%），所以这些都是可用的测量值；
# 主要误差来自关键点本身的定位（衣服/遮挡下几厘米）。
enabled = true

# 速度：位置卡尔曼的速度状态已经比较平滑，但 15 Hz 下量测噪声导数化还会带出
# ±0.4 m/s 的抖动，所以再走一道指数平滑。tau（秒）越小越跟手、越大越平滑；
# 设 0 = 不平滑（看原始抖动时用）。speed_deadband 只影响显示与“静止/行走”标签。
speed_smoothing = 0.3
speed_deadband = 0.15

# 步态：抬脚判据是“踝相对髀的竖直位移超过 μ + k·σ”（μ/σ 取自下面这个窗口），
# 抬脚->落地算一步；只有地面速度 ≥ walk_speed 时才计步（防止站着挪重心被算成走路）。
# 步幅 = 地面速度 × 60 / 步频（m/步），不另做足底接触检测。
gait_window = 4.0
gait_lift_k = 0.8
walk_speed = 0.25

# 身高：COCO-17 最高点是鼻尖，比头顶低 ~0.12 m，不补就系统性低估（约 7%）。
# 只在“躯干接近直立（夹角余弦 ≥ stand_cos）+ 头与双踝都有数 + 高度落在区间内”
# 才给出身高；坐着/躺着/半身入画时宁可不给，也不给一个看着像真的错数。
head_offset = 0.12
height_min = 1.2
height_max = 2.2
stand_cos = 0.8

[fall]
# 摔倒检测（状态机在 fall.py）。三步判据：冲击 -> 躺倒 -> 持续，缺一步不报警。
# 它不受 [metrics].enabled 影响：安全类功能不该因为“不看尺寸”就没了。
# 用 --no-fall 临时关掉，--fall 打开。
#
# 已知边界：主动快速躺到地上也会报（速度和姿态与摔倒分不开）；被抱起来搬走可能
# 误报。这只能靠报警后人工确认——本模块只负责报，不做抑制。
enabled = true

# 冲击（短时间内的快速下沉）：向下速度超过 impact_speed，或者 impact_window 秒内
# 从窗口高点掉了 drop_height（后者靠真深度实测，速度滤波滞后时也能兜住）。
impact_speed = 1.0
impact_window = 0.7
drop_height = 0.35

# 躺倒：躯干与“上”方向夹角超过 lying_angle 度；角度测不到（躺着时关键点常被
# 床/腿挡住）就用“比站立参考高度低 lying_height 米”兜底——站立参考是自动学的
# （只在正常且直立时更新的 EMA），所以不用量相机装多高。
lying_angle = 60.0
lying_height = 0.35

# 时序：躺倒连续保持 lying_time 秒才确认报警（把“蹲一下又起来”排掉）；冲击后
# confirm_window 秒内没能确认就当没事（慢慢躺下没有冲击，本来也不会进这一步）。
# 报警后要直立保持 recover_time 秒才解除（爬起来的过程中不闪烁）。
lying_time = 1.2
confirm_window = 3.0
recover_angle = 35.0
recover_time = 1.0

[pose3d]
# 整个 3D 链路的总开关：关掉后不记 3D 骨架/轨迹/点云/深度图，也不输出世界坐标，
# 只留 2D（人照样带 id）——想省 viewer 内存或只看检测框时用 --no-pose3d。
enabled = true

# 3D 关键点的卡尔曼滤波（每个人的每个关键点一个恒定速度滤波，平滑深度抖动）。
kalman = true
# 过程噪声（加速度，m/s²）：越大越跟手、越不平滑。
kalman_process = 10.0
# 观测噪声（m）：越大越平滑（越信历史、越不信当前观测）。
# D435i 的真深度比 hik 的单目深度稳得多，所以这里的 r 比 hik 小一个量级。
kalman_measurement = 0.02

# 左列下面再放一块对齐深度图（Turbo 伪彩，悬停看米数）。
depth_view = true

# 固定 3D 视角（相机坐标系，米）：eye=眼位，look_at=看向的点，eye_up=上方向。
# 不固定的话 rerun 会按数据包围盒自动取景，深度/点云逐帧变化，画面会一直"自动缩放"。
# 想换视角就改这三个数（Y 向下，所以上方向是 -Y）；viewer 里仍可鼠标拖。
eye = [0.0, 0.0, -1.5]
look_at = [0.0, 0.0, 2.5]
eye_up = [0.0, -1.0, 0.0]

[track]
# 跨帧关联（IoU 贪心配对）与 id：
# 配对上的沿用同一个 id，配不上的新建轨迹，连续漏检超过 max_missed 帧才删。id 单调
# 递增、永不复用。IoU 门限定得越高越容易"换人"，越低越容易把两个人并成一个。
iou_threshold = 0.3
# >0 时配对还要满足 3D 距离不超过这个值（米），防止两人交叉/擦肩时换 id；0 = 只看 IoU。
match_max_distance = 0.0
# 轨迹删掉前允许漏检多少帧（15 Hz 推理下 5 帧 ≈ 0.33 s）。
max_missed = 5
# 单个关键点连续漏检多少帧后不再画（人的其他部位继续画）。
max_missed_kpt = 3
# 轨迹点数上限与采样间隔（秒）。0 长度 = 不留轨迹。
trail_length = 300
trail_interval = 0.1

[points]
# 彩色点云（相机坐标系，米）。D435i 现成的能力，比 hik 只有单目深度图实在得多。
enabled = true
# 点云频率（Hz）。640×480 stride 4 约 1.9 万点，10 Hz 足够看清结构。
hz = 10.0
# 像素抽稀步长：4 -> 约 1.9 万点（16 万点全发会明显吃 viewer 内存）。
stride = 4
# 只保留这个距离范围内的点（米）。D435i 在 0.3-3 m 最准，远处噪声大。
max_distance = 4.0
min_distance = 0.05

[world]
# 世界系（地面系）坐标：把人的位置从相机系换算到一个"相机正下方的地面点"为原点的
# 坐标系（X 前 / Y 左 / Z 上，照 ROS REP-103 的习惯）。只需要一个静态外参，不用标定板。
#
# 默认关：不知道安装高度/俯仰角时，开出来的世界坐标是错的，不如只用相机系。
# 量一下装多高、镜头往下俯了几度，填进来再开。
enabled = false
height = 1.0        # 光心离地高度（米）
pitch_deg = 0.0     # 镜头下俯角度（正 = 向下；0 = 完全水平）
yaw_deg = 0.0       # 绕世界 Z 轴左转为正
roll_deg = 0.0

# 世界系视图里也放一份点云（刚体变换后）以及是否在 rerun 里加这个世界系 3D 视图。
pointcloud = true
view = true
